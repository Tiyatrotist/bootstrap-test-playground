name: Playground improvement
description: Improve the playground itself
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - customization
        - regression
        - coverage
        - reproductions
        - a11y
        - tooling
        - docs
        - infra
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard, missing, or inconsistent today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the smallest useful change.
    validations:
      required: true
